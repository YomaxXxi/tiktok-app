<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Connecting TikTok...</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 60px 20px; background: #0b0f19; color: #f8fafc; }
        .box { background: #111827; max-width: 520px; margin: 0 auto; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #374151; }
        .spinner { border: 4px solid #1f2937; border-top: 4px solid #00f2fe; border-radius: 50%; width: 44px; height: 44px; animation: spin 1s linear infinite; margin: 24px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { color: #94a3b8; font-size: 15px; line-height: 1.5; }
        .btn { display: inline-block; padding: 10px 20px; background: #3b82f6; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; margin-top: 15px; }
        code { background: #1f2937; padding: 4px 8px; border-radius: 4px; word-break: break-all; color: #38bdf8; font-size: 13px; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="color: #38bdf8; margin-top:0;">Підключення TikTok акаунта...</h2>
        <div class="spinner" id="loader"></div>
        <p id="status">Перенаправлення на локальний сервер бота...</p>
        <div id="manual" style="display: none; margin-top: 20px;">
            <p>Якщо перенаправлення не відбулося автоматично:</p>
            <a id="link" href="#" class="btn">Завершити підключення локально</a>
            <p style="margin-top: 15px; font-size: 12px;">Код авторизації: <br><code id="code-box"></code></p>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');
        if (code) {
            const localUrl = "http://127.0.0.1:8000/api/tiktok/callback?code=" + encodeURIComponent(code) + (state ? "&state=" + encodeURIComponent(state) : "");
            window.location.href = localUrl;
            setTimeout(() => {
                document.getElementById('manual').style.display = 'block';
                document.getElementById('link').href = localUrl;
                document.getElementById('code-box').innerText = code;
            }, 2500);
        } else {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('status').innerText = "Не знайдено коду авторизації у посиланні.";
        }
    </script>
</body>
</html>
